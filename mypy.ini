# The strict type checking Home Assistant applies to an integration listed in
# its `.strict-typing`, which is half of what the `strict-typing` rule of the
# quality scale asks for - see issue #125 and
# `custom_components/solarfocus/quality_scale.yaml`.
#
# Core keeps the same settings in its own `mypy.ini`, generated by hassfest:
# the block below is that file's `[mypy]` section, plus the eight flags
# `.strict-typing` turns back on per integration. Nothing generates this file,
# it is copied - core is the source of truth, and this is worth re-reading
# against it now and then.
#
# There are deliberately no per-module exceptions here: every module of the
# integration passes as it stands, and the point of the gate is that it stays
# that way. The other half of the rule is pysolarfocus shipping a `py.typed`,
# which is a change in that library rather than here.

[mypy]
python_version = 3.14
platform = linux
show_error_codes = true
follow_imports = normal
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
